<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Maritime – Scroll Journey</title>
<style>
:root{--bg:#04080d;--fg:#e8fbff;--accent:#5ef2e0;--dim:rgba(232,251,255,.62);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;overflow-x:hidden}
#loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);transition:opacity .8s,visibility .8s}
#loader.done{opacity:0;visibility:hidden}
#loader div{text-align:center;letter-spacing:.3em;font-size:.8rem;color:var(--dim)}
#bar{width:min(260px,60vw);height:2px;background:rgba(255,255,255,.12);margin:14px auto 0;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);box-shadow:0 0 12px var(--accent)}
#track{height:800vh;position:relative}
#stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;perspective:1100px;perspective-origin:50% 45%;display:grid;place-items:center}
#bgglow{position:absolute;inset:-10%;background:radial-gradient(ellipse at 50% 50%,rgba(40,140,160,.22),transparent 60%);transition:transform .2s}
#world{position:relative;width:min(92vw,calc(86vh*16/9));aspect-ratio:16/9;transform-style:preserve-3d;will-change:transform}
#screen{position:absolute;inset:0;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 40px 120px rgba(0,0,0,.8),0 0 0 1px rgba(94,242,224,.25),0 0 80px rgba(94,242,224,.12);transform:translateZ(0)}
canvas{width:100%;height:100%;display:block}
#screen::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
#sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.5}
.layer{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.frame3d{position:absolute;inset:-3%;border:1px solid rgba(94,242,224,.35);border-radius:18px;transform:translateZ(60px)}
.frame3d::before,.frame3d::after{content:"";position:absolute;width:26px;height:26px;border:2px solid var(--accent)}
.frame3d::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.frame3d::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.cap{position:absolute;left:5%;bottom:9%;max-width:min(520px,80%);opacity:0;transform:translate3d(0,30px,120px);transition:opacity .6s,transform .8s cubic-bezier(.2,.8,.2,1);text-shadow:0 2px 24px rgba(0,0,0,.9)}
.cap.on{opacity:1;transform:translate3d(0,0,120px)}
.cap small{display:block;letter-spacing:.35em;color:var(--accent);font-size:clamp(.6rem,1.4vw,.8rem);margin-bottom:.5em}
.cap h2{margin:0;font-weight:600;font-size:clamp(1.3rem,4.2vw,3rem);line-height:1.05;letter-spacing:.04em;text-transform:uppercase}
.cap p{margin:.6em 0 0;color:var(--dim);font-size:clamp(.8rem,1.8vw,1.1rem);line-height:1.4}
#hud{position:absolute;right:5%;top:6%;text-align:right;font-size:clamp(.6rem,1.3vw,.8rem);letter-spacing:.25em;color:var(--accent);transform:translateZ(90px);text-shadow:0 0 12px rgba(94,242,224,.6)}
#hud b{display:block;font-weight:600;font-size:clamp(1rem,2.6vw,1.6rem);color:var(--fg)}
#hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:.7rem;letter-spacing:.35em;color:var(--dim);transition:opacity .5s;text-align:center}
#hint span{display:block;width:1px;height:28px;margin:8px auto 0;background:linear-gradient(var(--accent),transparent);animation:d 1.6s infinite}
@keyframes d{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
#prog{position:fixed;right:14px;top:50%;height:30vh;width:2px;background:rgba(255,255,255,.14);transform:translateY(-50%);z-index:5}
#prog i{position:absolute;left:0;top:0;width:100%;height:0;background:var(--accent);box-shadow:0 0 10px var(--accent)}
@media (prefers-reduced-motion:reduce){.cap{transition:none}#hint span{animation:none}}
</style>
</head>
<body>
<div id="loader"><div>LOADING VOYAGE<div id="bar"><i></i></div></div></div>
<div id="prog"><i></i></div>
<main id="track">
 <section id="stage">
  <div id="bgglow"></div>
  <div id="world">
   <div id="screen"><canvas id="c"></canvas><div id="sheen"></div></div>
   <div class="layer">
    <div class="frame3d"></div>
    <div id="hud">DEPTH LAYER<b id="pct">00%</b></div>
    <div class="cap" data-a="0.02" data-b="0.22"><small>01 · THE STORM</small><h2>Into the weather</h2><p>Scroll to move through the clouds.</p></div>
    <div class="cap" data-a="0.27" data-b="0.45"><small>02 · THE VESSEL</small><h2>One ship, one horizon</h2><p>The cargo carrier breaks through open water.</p></div>
    <div class="cap" data-a="0.5" data-b="0.74"><small>03 · THE SIGNAL</small><h2>Every route, live</h2><p>Speed, heading and risk are mapped in real time.</p></div>
   </div>
  </div>
  <div id="hint">SCROLL<span></span></div>
 </section>
</main>
