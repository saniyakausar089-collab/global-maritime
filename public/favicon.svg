<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  
  <!-- Outer glowing nautical ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Anchor Top Ring -->
  <circle cx="32" cy="18" r="5" fill="none" stroke="url(#blueGrad)" stroke-width="3"/>
  <circle cx="32" cy="18" r="2" fill="#10b981"/>

  <!-- Anchor Stock (horizontal crossbar) -->
  <line x1="21" y1="28" x2="43" y2="28" stroke="url(#blueGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="21" cy="28" r="2" fill="#38bdf8"/>
  <circle cx="43" cy="28" r="2" fill="#38bdf8"/>

  <!-- Anchor Shank (vertical central shaft) -->
  <line x1="32" y1="23" x2="32" y2="48" stroke="url(#blueGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Anchor Flukes & Arms (curved bottom) -->
  <path d="M17 38 C 17 52, 47 52, 47 38" fill="none" stroke="url(#blueGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left arrowhead fluke -->
  <polygon points="17,35 13,40 20,40" fill="#38bdf8"/>
  <!-- Right arrowhead fluke -->
  <polygon points="47,35 44,40 51,40" fill="#38bdf8"/>

  <!-- Center Bill Dot -->
  <circle cx="32" cy="50" r="2.5" fill="#10b981"/>
</svg>

