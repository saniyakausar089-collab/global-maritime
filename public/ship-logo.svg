<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shipCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#00ffc6" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Mast / Radar antenna -->
  <line x1="32" y1="12" x2="32" y2="20" stroke="#00f3ff" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="11" r="2" fill="#00ffc6" filter="url(#cyanGlow)" />
  <line x1="28" y1="16" x2="36" y2="16" stroke="#00f3ff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Bridge / Superstructure -->
  <polygon points="26,20 38,20 36,29 28,29" fill="#0c1524" stroke="#00f3ff" stroke-width="1.5" />
  <rect x="29" y="22" width="6" height="3" rx="0.5" fill="#00ffc6" opacity="0.9" />

  <!-- Container / Deck Block -->
  <rect x="18" y="27" width="9" height="5" rx="0.5" fill="#082032" stroke="#00f3ff" stroke-width="1" />
  <rect x="37" y="27" width="9" height="5" rx="0.5" fill="#082032" stroke="#00f3ff" stroke-width="1" />

  <!-- Main Vessel Hull (Streamlined commercial container/cargo hull) -->
  <path d="M7 34 L12 47 C13 49 15 50 17 50 L47 50 C49 50 51 49 52 47 L57 34 Z" fill="url(#shipCyanGrad)" filter="url(#cyanGlow)" opacity="0.95" />
  <!-- Hull Upper Deck line -->
  <path d="M5 34 L59 34" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  
  <!-- Ocean waterline / Wake lines -->
  <path d="M3 53 C12 55, 20 52, 32 53 C44 54, 52 52, 61 53" stroke="#00f3ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M8 57 C18 58, 28 56, 38 57 C48 58, 54 56, 58 57" stroke="#00ffc6" stroke-width="1" stroke-linecap="round" opacity="0.4" />
</svg>
